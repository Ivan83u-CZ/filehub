# Keep query strings and bearer-like values out of the access log.
log_format filehub_safe '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '$request_time upstream_status=$upstream_status upstream_time=$upstream_response_time '
                        'request_id=$request_id';

# Preflight is never rate-limited: a 429 on OPTIONS makes the browser report a
# generic backend connection error before the real API request is even sent.
map $request_method $filehub_limit_key {
    default $binary_remote_addr;
    OPTIONS "";
}

limit_req_zone $filehub_limit_key zone=filehub_auth:1m   rate=10r/s;
limit_req_zone $filehub_limit_key zone=filehub_events:1m rate=5r/s;
limit_req_zone $filehub_limit_key zone=filehub_media:1m  rate=30r/s;
limit_req_zone $filehub_limit_key zone=filehub_api:1m    rate=30r/s;

server {
    listen 80;
    server_name filehub.ivan83u.ru;
    access_log /var/log/nginx/filehub_access.log filehub_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name filehub.ivan83u.ru;

    ssl_certificate /etc/letsencrypt/live/filehub.ivan83u.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filehub.ivan83u.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    access_log /var/log/nginx/filehub_access.log filehub_safe;
    client_max_body_size 55m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 = @filehub_rate_limited;

    location = /oauth/callback {
        return 204;
    }

    # JWT exchange and refresh are expensive and must not compete with a burst
    # of media reads from many amoCRM cards in the same office NAT.
    location = /wp-json/czfh/v1/session {
        # Start-of-shift bursts from several operators behind one office NAT
        # must not turn into a generic "backend unavailable" message.
        limit_req zone=filehub_auth burst=30 nodelay;
        include /etc/nginx/snippets/filehub-proxy.inc;
    }

    location = /wp-json/czfh/v1/session/refresh {
        limit_req zone=filehub_auth burst=30 nodelay;
        include /etc/nginx/snippets/filehub-proxy.inc;
    }

    # Telemetry is diagnostic only; it has a strict independent budget.
    location = /wp-json/czfh/v1/client-events {
        limit_req zone=filehub_events burst=10 nodelay;
        include /etc/nginx/snippets/filehub-proxy.inc;
    }

    location ~ ^/wp-json/czfh/v1/(thumb|file)$ {
        limit_req zone=filehub_media burst=60 nodelay;
        include /etc/nginx/snippets/filehub-proxy.inc;
    }

    location /wp-json/czfh/v1/ {
        limit_req zone=filehub_api burst=60 nodelay;
        include /etc/nginx/snippets/filehub-proxy.inc;
    }

    location @filehub_rate_limited {
        internal;
        default_type application/json;
        add_header Access-Control-Allow-Origin "https://chinazub.amocrm.ru" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-FH-Session, Content-Type, X-Correlation-ID, X-API-KEY" always;
        add_header Access-Control-Expose-Headers "Retry-After, X-Request-ID" always;
        add_header Retry-After 5 always;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Vary "Origin" always;
        return 429 '{"error":"gateway_rate_limited"}';
    }

    location / {
        return 404;
    }
}
