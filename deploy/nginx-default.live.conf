# RC02 POC: HTTPS without client cert; authorization via signed amoCRM JWT.
upstream filehub_interactive { server php:9000; }
upstream filehub_media { server php:9001; }
upstream filehub_operations { server php:9002; }
upstream filehub_auth { server php:9003; }
map "$request_method:$uri" $filehub_php {
    default filehub_interactive;
    ~^POST:/wp-json/czfh/v1/session(?:/refresh)?$ filehub_auth;
    ~^GET:/wp-json/czfh/v1/(?:file|thumb)$ filehub_media;
    ~^GET:/wp-json/czfh/v1/activity$ filehub_operations;
    ~^POST:/wp-json/czfh/v1/(?:upload|rename|trash|restore)$ filehub_operations;
}
map $uri $filehub_health_php {
    default filehub_interactive;
    /_health/auth filehub_auth;
    /_health/media filehub_media;
    /_health/operations filehub_operations;
}
# Журнал HTTP-кодов API: без IP и без query-строки, поэтому в лог не попадают ни идентификатор
# лида, ни имена файлов, ни подписи (leadId/name приходят именно в query-строке).
log_format fh12 '$time_iso8601 $status $request_method $uri $request_time $upstream_response_time';
map $http_origin $fh_origin_allowed {
    default 0;
    "" 1;
    "https://chinazub.amocrm.ru" 1;
}
server {
    listen 8443 ssl;
    server_name 127.0.0.1;
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 22m;   # >= PHP post_max_size (22M); прикладной лимит - 20 МиБ (FH12_MAX_UPLOAD)
    add_header Referrer-Policy no-referrer always;
    ssl_certificate /etc/filehub-pki/server.crt;
    ssl_certificate_key /etc/filehub-pki/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;

    location ~ ^/_health(?:/(?:auth|media|operations|interactive))?$ {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/health.php;
        fastcgi_param SCRIPT_NAME /health.php;
        fastcgi_read_timeout 5s;
        fastcgi_pass $filehub_health_php;
        limit_except GET { deny all; }
    }
    location ~ ^/wp-json/czfh/v1/(ping|session|session/refresh|client-events|activity|files|file|thumb|upload|rename|trash|restore|fh11|calls_feed|proxy_save_call|ai_analyze|ai_report|ai_test|operator_card|operator_card_diag|operator_card_publish_local|operator_card_wazzup_snapshot)$ {
        access_log /dev/stdout fh12;
        if ($fh_origin_allowed = 0) { return 403; }
        add_header Access-Control-Allow-Origin "https://chinazub.amocrm.ru" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-Auth-Token, X-FH-Session, X-Correlation-ID, Content-Type" always;
        add_header Access-Control-Allow-Private-Network "true" always;
        add_header Access-Control-Max-Age "600" always;
        # R1/R2: клиент читает собственный идентификатор запроса сервера для корреляции.
        add_header Access-Control-Expose-Headers "X-Request-ID, Retry-After" always;
        add_header Vary "Origin" always;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        if ($request_method = OPTIONS) { return 204; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api.php;
        fastcgi_param SCRIPT_NAME /api.php;
        # Stream the multipart request to FPM; do not spool 50 MiB in nginx tmpfs.
        fastcgi_request_buffering off;
        # Ответ отдаётся клиенту сразу, без промежуточной записи во временный файл nginx
        # (было предупреждение "an upstream response is buffered to a temporary file").
        fastcgi_buffering off;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 300s;
        client_body_timeout 300s;
        fastcgi_pass $filehub_php;
    }
    location / { return 404; }
}
