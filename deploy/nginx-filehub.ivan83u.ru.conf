limit_req_zone $binary_remote_addr zone=filehub_public:1m rate=15r/s;

server {
    listen 80;
    server_name filehub.ivan83u.ru;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name filehub.ivan83u.ru;

    ssl_certificate /etc/letsencrypt/live/filehub.ivan83u.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filehub.ivan83u.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    access_log off;
    client_max_body_size 55m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /oauth/callback {
        return 204;
    }

    location ^~ /wp-json/czfh/v1/ {
        limit_req zone=filehub_public burst=30 nodelay;
        limit_req_status 429;
        limit_req_log_level notice;
        error_page 429 = @filehub_rate_limited;
        proxy_pass https://127.0.0.1:18444;
        proxy_ssl_verify off;
        proxy_ssl_server_name off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Auth-Token $http_x_auth_token;

        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_send_timeout 300s;
        proxy_read_timeout 600s;
    }

    location @filehub_rate_limited {
        internal;
        default_type application/json;
        add_header Access-Control-Allow-Origin "https://chinazub.amocrm.ru" always;
        add_header Access-Control-Expose-Headers "Retry-After" always;
        add_header Retry-After 1 always;
        add_header Cache-Control no-store always;
        return 429 '{"error":"gateway_rate_limited"}';
    }

    location / {
        return 404;
    }
}
