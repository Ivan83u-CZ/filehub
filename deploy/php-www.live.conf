[www]
pm = ondemand
pm.max_children = 2
include = /usr/local/etc/php-fpm.d/filehub-pool.inc
env[FILEHUB_HEALTH_POOL] = interactive

[filehub_media]
listen = 9001
pm = ondemand
pm.max_children = 2
include = /usr/local/etc/php-fpm.d/filehub-pool.inc
env[FILEHUB_HEALTH_POOL] = media

[filehub_operations]
listen = 9002
pm = ondemand
pm.max_children = 2
include = /usr/local/etc/php-fpm.d/filehub-pool.inc
env[FILEHUB_HEALTH_POOL] = operations

[filehub_auth]
listen = 9003
pm = ondemand
pm.max_children = 1
include = /usr/local/etc/php-fpm.d/filehub-pool.inc
env[FILEHUB_HEALTH_POOL] = auth
