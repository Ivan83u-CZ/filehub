expose_php=Off
display_errors=Off
log_errors=On
memory_limit=128M
upload_max_filesize=20M
post_max_size=22M
; post_max_size > upload_max_filesize: тело multipart с файлом 20..21 МиБ должно
; разбираться PHP, иначе PHP отбрасывает запрос целиком и клиент получает 400 вместо 413
max_input_time=300
max_execution_time=600

; 20 MiB multipart bodies are spooled to disk, NOT the small /tmp tmpfs.
upload_tmp_dir=/var/www/upload_tmp
