; Thumbnail worker limits.
; memory_limit covers the worst case of the bomb check: a 16 MP image decoded to RGBA
; is ~64 MiB, plus the source bytes and the resized canvas. The container mem_limit
; (160m) is the outer bound. The VPS has 961 MiB of RAM in total, so this service is
; deliberately small.
memory_limit=128M
post_max_size=24M
upload_max_filesize=24M
max_execution_time=120
max_input_time=120
display_errors=Off
log_errors=On
expose_php=Off
